name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main, preview]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

# Push baru ke PR yang sama -> run lama otomatis dibatalin
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            run: pnpm typecheck
          - name: Lint
            run: pnpm lint
          - name: Unit & Integration Tests
            # Eight concurrent jsdom forks exhausted runner memory (PR #105, 2026-11-01).
            # Cap only CI workers; local Vitest defaults remain unchanged.
            run: pnpm test -- --run --maxWorkers=2
          - name: Build
            run: pnpm build
    env:
      IMAGE_PROXY_SECRET: ci-only-unsigned-test-secret-not-for-production-2026
      NEXT_PUBLIC_APP_URL: https://www.yomirra.web.id

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Next build cache, cuma relevan buat job Build
      - name: Cache Next.js build
        if: matrix.name == 'Build'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  browser:
    name: Production build browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      IMAGE_PROXY_SECRET: ci-only-unsigned-test-secret-not-for-production-2026
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      E2E_PRODUCTION_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: pnpm exec playwright test --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: test-results/
